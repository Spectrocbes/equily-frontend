<div class="fixed inset-0 z-50 flex items-center justify-center p-4"
     tabindex="0"
     (click)="closed.emit()"
     (keydown.escape)="closed.emit()">
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>

  <div class="relative w-full max-w-sm rounded-2xl
              bg-white dark:bg-slate-800 shadow-2xl
              border border-slate-200 dark:border-slate-700 p-6"
       tabindex="-1"
       (click)="$event.stopPropagation()"
       (keydown.escape)="closed.emit()">

    <!-- Icon + title -->
    <div class="flex items-center gap-4 mb-4">
      <div class="w-10 h-10 rounded-full bg-rose-100 dark:bg-rose-900/30
                  flex items-center justify-center flex-shrink-0">
        <svg class="w-5 h-5 text-rose-500" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0
                   01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0
                   00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
      </div>
      <div>
        <h2 class="text-base font-semibold text-slate-900 dark:text-white">
          {{ 'deleteTransaction.title' | translate }}
        </h2>
        <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">
          {{ ('transaction.type.' + transactionType()) | translate }} · {{ transactionDate() | date:'mediumDate' }} · {{ transactionAmount() | userCurrency }}
        </p>
      </div>
    </div>

    <!-- Warning -->
    <div class="rounded-xl bg-rose-50 dark:bg-rose-900/20
                border border-rose-200 dark:border-rose-800
                px-4 py-3 text-sm text-rose-600 dark:text-rose-400 mb-6">
      {{ 'deleteTransaction.warning' | translate }}
    </div>

    <!-- Actions -->
    <div class="flex gap-3">
      <button type="button"
              (click)="closed.emit()"
              class="flex-1 px-4 py-2.5 rounded-xl text-sm font-medium
                     border border-slate-200 dark:border-slate-600
                     text-slate-700 dark:text-slate-300
                     hover:bg-slate-50 dark:hover:bg-slate-700
                     transition-colors">
        {{ 'common.cancel' | translate }}
      </button>
      <button type="button"
              (click)="confirmed.emit()"
              [disabled]="loading()"
              class="flex-1 px-4 py-2.5 rounded-xl text-sm font-medium
                     bg-rose-500 hover:bg-rose-600
                     disabled:opacity-50 text-white transition-colors">
        @if (loading()) { {{ 'common.deleting' | translate }} } @else { {{ 'deleteTransaction.confirm' | translate }} }
      </button>
    </div>
  </div>
</div>
