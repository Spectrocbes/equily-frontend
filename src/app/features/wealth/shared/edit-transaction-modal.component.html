<div class="fixed inset-0 z-50 flex items-center justify-center p-4"
     (mousedown)="onBackdropMouseDown($event)"
     (mouseup)="onBackdropMouseUp($event)">
  <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>

  <div class="relative w-full max-w-md rounded-2xl
              bg-white dark:bg-slate-800 shadow-2xl
              border border-slate-200 dark:border-slate-700 p-6 space-y-4">

    <!-- Header -->
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-lg font-semibold text-slate-900 dark:text-white">
          Edit transaction
        </h2>
        <span class="inline-flex mt-1 px-2 py-0.5 rounded-md text-xs font-medium
                     bg-slate-100 dark:bg-slate-700
                     text-slate-600 dark:text-slate-300">
          {{ transaction().type }}
          @if (transaction().ticker) { · {{ transaction().ticker }} }
        </span>
      </div>
      <button (click)="closed.emit()"
              class="w-8 h-8 rounded-lg flex items-center justify-center
                     text-slate-400 hover:text-slate-600
                     hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <form [formGroup]="form()" (ngSubmit)="onSubmit()" class="space-y-4">

      <!-- Total amount -->
      <div>
        <label for="edit-totalAmount"
               class="block text-sm font-medium
                       text-slate-700 dark:text-slate-300 mb-1.5">
          Total amount (€)
        </label>
        <input id="edit-totalAmount" formControlName="totalAmount" type="number"
               step="0.01" min="0.01"
               class="w-full px-3 py-2 rounded-lg text-sm
                      bg-slate-50 dark:bg-slate-900
                      border border-slate-200 dark:border-slate-600
                      text-slate-900 dark:text-white
                      focus:outline-none focus:ring-2
                      focus:ring-primary-500 transition-colors"/>
        @if (showError('totalAmount')) {
          <p class="text-rose-500 text-xs mt-1">Amount must be greater than 0</p>
        }
      </div>

      <!-- Date -->
      <div>
        <label for="edit-date"
               class="block text-sm font-medium
                       text-slate-700 dark:text-slate-300 mb-1.5">
          Date
        </label>
        <input id="edit-date" formControlName="date" type="date"
               min="1900-01-01"
               class="w-full px-3 py-2 rounded-lg text-sm
                      bg-slate-50 dark:bg-slate-900
                      border border-slate-200 dark:border-slate-600
                      text-slate-900 dark:text-white
                      focus:outline-none focus:ring-2
                      focus:ring-primary-500 transition-colors"/>
      </div>

      <!-- Fees (BUY/SELL only) -->
      @if (transaction().type === 'BUY' || transaction().type === 'SELL') {
        <div>
          <label for="edit-fees"
                 class="block text-sm font-medium
                         text-slate-700 dark:text-slate-300 mb-1.5">
            Brokerage fees (€)
          </label>
          <input id="edit-fees" formControlName="fees" type="number"
                 step="0.01" min="0"
                 class="w-full px-3 py-2 rounded-lg text-sm
                        bg-slate-50 dark:bg-slate-900
                        border border-slate-200 dark:border-slate-600
                        text-slate-900 dark:text-white
                        focus:outline-none focus:ring-2
                        focus:ring-primary-500 transition-colors"/>
        </div>
      }

      <!-- Description -->
      <div>
        <label for="edit-description"
               class="block text-sm font-medium
                       text-slate-700 dark:text-slate-300 mb-1.5">
          Description
          <span class="text-slate-400 font-normal">(optional)</span>
        </label>
        <input id="edit-description" formControlName="description" type="text"
               placeholder="e.g. Monthly savings"
               class="w-full px-3 py-2 rounded-lg text-sm
                      bg-slate-50 dark:bg-slate-900
                      border border-slate-200 dark:border-slate-600
                      text-slate-900 dark:text-white
                      placeholder:text-slate-400
                      focus:outline-none focus:ring-2
                      focus:ring-primary-500 transition-colors"/>
      </div>

      <!-- Actions -->
      <div class="flex gap-3 pt-1">
        <button type="button" (click)="closed.emit()"
                class="flex-1 px-4 py-2 rounded-lg text-sm font-medium
                       border border-slate-200 dark:border-slate-600
                       text-slate-700 dark:text-slate-300
                       hover:bg-slate-50 dark:hover:bg-slate-700
                       transition-colors">
          Cancel
        </button>
        <button type="submit"
                [disabled]="loading()"
                class="flex-1 px-4 py-2 rounded-lg text-sm font-medium
                       bg-primary-500 hover:bg-primary-600
                       disabled:opacity-50 text-white transition-colors">
          @if (loading()) { Saving... } @else { Save changes }
        </button>
      </div>

    </form>
  </div>
</div>
