<div class="fixed inset-0 z-50 flex items-center justify-center p-4"
     tabindex="0"
     (mousedown)="onBackdropMouseDown($event)"
     (mouseup)="onBackdropMouseUp($event)"
     (keydown.escape)="closed.emit()">
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>

  <div class="relative w-full max-w-md rounded-md
              bg-surface-card shadow-2xl
              border border-border p-6"
       tabindex="-1"
       (mousedown)="$event.stopPropagation()"
       (keydown.escape)="closed.emit()">

    <!-- Icon + title -->
    <div class="flex items-center gap-3 mb-4">
      <div class="w-10 h-10 rounded-full bg-rose-100 dark:bg-rose-900/30
                  flex items-center justify-center flex-shrink-0">
        <svg class="w-5 h-5 text-rose-500" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0
                   01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0
                   00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
      </div>
      <div>
        <h2 class="text-lg font-semibold text-ink-primary">
          {{ 'deleteAccount.title' | translate }}
        </h2>
        <p class="text-sm text-ink-secondary">
          {{ 'deleteAccount.subtitle' | translate }}
        </p>
      </div>
    </div>

    <!-- Account info -->
    <div class="rounded-md bg-surface-raised
                border border-border
                px-4 py-3 mb-4">
      <div class="flex items-center gap-3 min-w-0">
        <app-broker-logo [broker]="account().broker" [size]="32"/>
        <div class="min-w-0">
          <p class="text-sm font-semibold text-ink-primary truncate">
            {{ account().name }}
          </p>
          <p class="text-xs text-ink-secondary mt-0.5 truncate">{{ account().broker }}@if (account().subType) { · {{ 'subType.' + account().subType | translate }} }</p>
        </div>
      </div>
    </div>

    <!-- Warning -->
    <div class="rounded-md bg-rose-50 dark:bg-rose-900/20
                border border-rose-200 dark:border-rose-800
                px-4 py-3 text-sm text-rose-600 dark:text-rose-400 mb-6">
      {{ 'deleteAccount.warning' | translate }}
    </div>

    <!-- Actions -->
    <div class="flex gap-3">
      <button type="button"
              (click)="closed.emit()"
              class="flex-1 px-4 py-2.5 rounded-md text-sm font-medium
                     border border-border
                     text-ink-secondary
                     hover:bg-surface-raised
                     transition-colors">
        {{ 'common.cancel' | translate }}
      </button>
      <button type="button"
              (click)="confirmed.emit()"
              [disabled]="loading()"
              class="flex-1 px-4 py-2.5 rounded-md text-sm font-semibold
                     bg-rose-500 hover:bg-rose-600
                     disabled:opacity-50 text-white transition-colors">
        @if (loading()) { {{ 'common.deleting' | translate }} } @else { {{ 'deleteAccount.confirm' | translate }} }
      </button>
    </div>
  </div>
</div>
