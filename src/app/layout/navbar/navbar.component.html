<nav class="h-16 flex-shrink-0 flex items-center justify-between
            px-4 lg:px-6 border-b border-slate-200 dark:border-slate-700
            bg-white dark:bg-slate-900 z-30">

  <!-- Left: hamburger + logo -->
  <div class="flex items-center gap-2">
    <button type="button" (click)="menuToggled.emit()"
            class="lg:hidden p-2 rounded-lg text-slate-500
                   hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24"
           stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <a routerLink="/overview"
       class="flex items-center gap-2 hover:opacity-80 transition-opacity">
      <div class="w-8 h-8 rounded-xl bg-primary-500
                  flex items-center justify-center">
        <span class="text-white font-bold text-sm">E</span>
      </div>
      <span class="hidden sm:block font-semibold text-slate-900 dark:text-white text-lg tracking-tight">
        Equily
      </span>
    </a>
  </div>

  <!-- Right actions -->
  <div class="flex items-center gap-3">

    <!-- Theme toggle -->
    <button
      (click)="themeService.toggle()"
      class="w-9 h-9 rounded-lg flex items-center justify-center
             text-slate-500 dark:text-slate-400
             hover:bg-slate-100 dark:hover:bg-slate-800
             transition-colors duration-150"
      [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
      @if (themeService.isDark()) {
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      } @else {
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      }
    </button>

    <!-- User avatar button -->
    <div class="relative">
      <button (click)="userMenuOpen.set(!userMenuOpen())"
              type="button"
              class="w-8 h-8 rounded-full bg-primary-500
                     flex items-center justify-center
                     text-white text-sm font-semibold
                     hover:bg-primary-600 transition-colors
                     focus:outline-none focus:ring-2
                     focus:ring-primary-500 focus:ring-offset-2">
        {{ userInitial() }}
      </button>

      @if (userMenuOpen()) {
        <!-- Backdrop -->
        <button type="button"
                class="fixed inset-0 z-10 cursor-default bg-transparent border-0 p-0"
                aria-label="Close menu"
                (click)="userMenuOpen.set(false)"></button>

        <!-- Dropdown -->
        <div class="absolute right-0 top-full mt-2 w-48 z-20
                    rounded-xl border border-slate-200 dark:border-slate-700
                    bg-white dark:bg-slate-800 shadow-lg
                    overflow-hidden">

          <!-- User info -->
          <div class="px-4 py-3 border-b border-slate-100 dark:border-slate-700">
            <p class="text-sm font-medium text-slate-900 dark:text-white truncate">
              {{ authService.currentUser()?.displayName ?? authService.currentUser()?.email }}
            </p>
            <p class="text-xs text-slate-500 dark:text-slate-400 truncate mt-0.5">
              {{ authService.currentUser()?.email }}
            </p>
          </div>

          <!-- Menu items -->
          <div class="py-1">
            <a routerLink="/settings"
               (click)="userMenuOpen.set(false)"
               class="flex items-center gap-3 px-4 py-2 text-sm
                      text-slate-700 dark:text-slate-300
                      hover:bg-slate-50 dark:hover:bg-slate-700
                      transition-colors">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                   stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0
                         1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87
                         .074.04.147.083.22.127.325.196.72.257 1.075.124l1.217
                         -.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125
                         0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a
                         6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005
                         .828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125
                         0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076
                         .124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644
                         .869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55
                         0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686
                         -.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257
                         -1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l
                         -1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c
                         .292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007
                         -.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01
                         -.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216
                         .456c.356.133.751.072 1.076-.124.072-.044.146-.087.22
                         -.128.332-.183.582-.495.644-.869l.214-1.281z"/>
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
              Settings
            </a>

            <button (click)="logout(); userMenuOpen.set(false)"
                    type="button"
                    class="flex items-center gap-3 px-4 py-2 text-sm w-full
                           text-rose-600 dark:text-rose-400
                           hover:bg-rose-50 dark:hover:bg-rose-900/20
                           transition-colors">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                   stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                      d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0
                         00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25
                         0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"/>
              </svg>
              Sign out
            </button>
          </div>
        </div>
      }
    </div>

  </div>
</nav>
