<nav class="fixed top-0 left-0 right-0 z-50 h-16
            bg-white/80 dark:bg-slate-900/80
            backdrop-blur-md
            border-b border-slate-200 dark:border-slate-700
            flex items-center justify-between px-6">

  <!-- Logo -->
  <a routerLink="/overview"
     class="flex items-center gap-2 no-underline">
    <div class="w-7 h-7 rounded-lg bg-primary-500 flex items-center justify-center">
      <span class="text-white font-bold text-sm">E</span>
    </div>
    <span class="font-semibold text-slate-900 dark:text-white text-lg tracking-tight">
      Equily
    </span>
  </a>

  <!-- Right actions -->
  <div class="flex items-center gap-3">

    <!-- Theme toggle -->
    <button
      (click)="themeService.toggle()"
      class="w-9 h-9 rounded-lg flex items-center justify-center
             text-slate-500 dark:text-slate-400
             hover:bg-slate-100 dark:hover:bg-slate-800
             transition-colors duration-150"
      [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
      @if (themeService.isDark()) {
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      } @else {
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      }
    </button>

    <!-- User avatar placeholder -->
    <div class="w-8 h-8 rounded-full bg-primary-100 dark:bg-primary-900
                flex items-center justify-center cursor-pointer
                hover:ring-2 hover:ring-primary-500 transition-all">
      <span class="text-primary-600 dark:text-primary-400 text-sm font-medium">K</span>
    </div>

  </div>
</nav>
