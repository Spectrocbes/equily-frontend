<div class="relative flex-shrink-0" [style.width.px]="size()" [style.height.px]="size()">
  <svg [attr.viewBox]="'0 0 ' + size() + ' ' + size()"
       [attr.width]="size()" [attr.height]="size()">
    <g [attr.transform]="'translate(' + size()/2 + ',' + size()/2 + ') rotate(-90)'">
      @for (slice of slices(); track slice.label) {
        <circle
          cx="0" cy="0" r="54"
          fill="none"
          [attr.stroke]="slice.color"
          stroke-width="20"
          [attr.stroke-dasharray]="slice.strokeDasharray"
          [attr.stroke-dashoffset]="slice.strokeDashoffset"
          stroke-linecap="butt"/>
      }
    </g>
    <!-- Center text -->
    <text x="50%" y="46%"
          text-anchor="middle" dominant-baseline="middle"
          class="fill-slate-900 dark:fill-white"
          style="font-size: 11px; font-weight: 600; font-family: ui-monospace, monospace;">
      {{ total() | currency:'EUR':'symbol':'1.0-0' }}
    </text>
    <text x="50%" y="58%"
          text-anchor="middle" dominant-baseline="middle"
          style="font-size: 9px; fill: #94a3b8;">
      Total
    </text>
  </svg>
</div>
