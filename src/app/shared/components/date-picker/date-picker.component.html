<div class="relative">
  <span class="block text-sm font-medium
               text-slate-700 dark:text-slate-300 mb-1.5">
    {{ label() }}
  </span>

  <!-- Trigger button -->
  <button type="button"
          (click)="open()"
          class="w-full flex items-center justify-between
                 px-3 py-2.5 rounded-lg text-sm text-left
                 bg-white dark:bg-slate-800
                 border border-slate-300 dark:border-slate-500
                 text-slate-700 dark:text-slate-200
                 hover:border-primary-400
                 focus:outline-none focus:ring-2
                 focus:ring-primary-500 transition-colors">
    <span [class.text-slate-400]="!selectedDate()">
      {{ displayValue() || 'Select a date' }}
    </span>
    <svg class="w-4 h-4 text-slate-400 flex-shrink-0"
         fill="none" viewBox="0 0 24 24"
         stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0
               002-2V7a2 2 0 00-2-2H5a2 2 0
               00-2 2v12a2 2 0 002 2z"/>
    </svg>
  </button>

  <!-- Calendar dropdown -->
  @if (isOpen()) {
    <!-- Backdrop -->
    <div class="fixed inset-0 z-40"
         role="button"
         tabindex="-1"
         (click)="close()"
         (keydown.escape)="close()"></div>

    <!-- Calendar panel -->
    <div class="absolute left-0 top-full mt-1 z-50
                w-72 rounded-2xl shadow-xl
                bg-white dark:bg-slate-800
                border border-slate-200 dark:border-slate-700
                overflow-hidden"
         tabindex="-1"
         (click)="$event.stopPropagation()"
         (keydown)="$event.stopPropagation()">

      <!-- Header: month navigation -->
      <div class="flex items-center justify-between px-4 py-3
                  border-b border-slate-100 dark:border-slate-700">
        <button type="button" (click)="prevMonth()"
                class="w-8 h-8 flex items-center justify-center
                       rounded-lg text-slate-400
                       hover:bg-slate-100 dark:hover:bg-slate-700
                       hover:text-slate-600 transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M15 19l-7-7 7-7"/>
          </svg>
        </button>

        <span class="text-sm font-semibold
                      text-slate-900 dark:text-white">
          {{ MONTHS[viewMonth()] }} {{ viewYear() }}
        </span>

        <button type="button" (click)="nextMonth()"
                class="w-8 h-8 flex items-center justify-center
                       rounded-lg text-slate-400
                       hover:bg-slate-100 dark:hover:bg-slate-700
                       hover:text-slate-600 transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>

      <!-- Day headers -->
      <div class="grid grid-cols-7 px-3 pt-2">
        @for (day of DAYS; track day) {
          <div class="h-8 flex items-center justify-center
                       text-xs font-medium
                       text-slate-400 dark:text-slate-500">
            {{ day }}
          </div>
        }
      </div>

      <!-- Day grid -->
      <div class="grid grid-cols-7 px-3 pb-3 gap-y-0.5">
        @for (day of calendarDays(); track day.date.toISOString()) {
          <button type="button"
                  (click)="selectDate(day)"
                  [disabled]="day.isDisabled"
                  class="h-8 w-full flex items-center justify-center
                         text-xs rounded-lg transition-colors
                         disabled:cursor-not-allowed"
                  [class]="
                    day.isSelected
                      ? 'bg-primary-500 text-white font-semibold'
                      : day.isToday && !day.isSelected
                        ? 'border border-primary-400
                           text-primary-500 dark:text-primary-400
                           hover:bg-primary-50 dark:hover:bg-primary-900/20'
                        : day.isDisabled
                          ? 'text-slate-300 dark:text-slate-600'
                          : !day.isCurrentMonth
                            ? 'text-slate-300 dark:text-slate-600
                               hover:bg-slate-50 dark:hover:bg-slate-700'
                            : 'text-slate-700 dark:text-slate-200
                               hover:bg-slate-100 dark:hover:bg-slate-700'
                  ">
            {{ day.day }}
          </button>
        }
      </div>

      <!-- Today shortcut -->
      <div class="border-t border-slate-100 dark:border-slate-700
                  px-4 py-2.5">
        <button type="button"
                (click)="selectDate({ date: today, isDisabled: false })"
                class="text-xs text-primary-500 hover:text-primary-600
                       dark:text-primary-400 font-medium transition-colors">
          Today
        </button>
      </div>
    </div>
  }
</div>
