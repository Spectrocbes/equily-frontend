<div class="fixed bottom-6 right-6 z-[100]
            flex flex-col gap-2 max-w-sm w-full pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="flex items-start gap-3 px-4 py-3 rounded-lg
                border border-l-4 bg-surface-card shadow-sm
                text-sm font-medium text-ink-primary
                pointer-events-auto"
         [class]="toastAccentClasses(toast.type)">

      <span class="flex-shrink-0 mt-0.5" [class]="toastIconClasses(toast.type)">
        @switch (toast.type) {
          @case ('error') {
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"/>
              <path stroke-linecap="round" d="M15 9l-6 6M9 9l6 6"/>
            </svg>
          }
          @case ('success') {
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.5 12.5l2.5 2.5 5-5.5"/>
            </svg>
          }
          @case ('warning') {
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 3.5h.01M10.29 3.86L1.82 18a1.5 1.5 0 001.3 2.25h17.76a1.5 1.5 0 001.3-2.25L13.71 3.86a1.5 1.5 0 00-2.42 0z"/>
            </svg>
          }
          @case ('info') {
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 8h.01M11 12h1v4h1"/>
            </svg>
          }
        }
      </span>

      <p class="flex-1 leading-snug">{{ toast.message }}</p>

      <button type="button"
              (click)="toastService.dismiss(toast.id)"
              class="flex-shrink-0 text-ink-muted opacity-70 hover:opacity-100
                     transition-opacity mt-0.5">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24"
             stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  }
</div>
